name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Ключ «Дадаты» для подсказок адресов по России. В репозитории его
      # нет — значение приходит из секрета репозитория. Секрет не задан —
      # сборка не падает, Россия работает на запасном провайдере.
      - run: npm run build
        env:
          VITE_DADATA_TOKEN: ${{ secrets.DADATA_TOKEN }}
          VITE_GEOAPIFY_TOKEN: ${{ secrets.GEOAPIFY_TOKEN }}
          # В отдельном репозитории для показа в списке версий остаётся только
          # Комбинированный. Условие по имени репозитория, а не по ветке: тот же
          # файл лежит в основном репозитории, и там список должен остаться
          # полным, чтобы тест не потерял версии.
          VITE_ONLY_VARIANT: ${{ github.repository == 'olgaperovamisc81/coral-club-checkout-combined' && 'combined' || '' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
